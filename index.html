<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>StreamBox IPTV Mundial</title>
  <script>
    var p = "https:" + "//";
    var cdn = p + "vjs.zencdn.net/8.10.0/";
    document.write('<link href="' + cdn + 'video-js.css" rel="stylesheet">');
    document.write('<script src="' + cdn + 'video.min.js"><\/script>');
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: #0f172a; color: #f8fafc; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    header { background: #1e293b; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
    .logo { font-size: 1.05rem; font-weight: bold; color: #38bdf8; }
    .logo span { color: #ffffff; }
    .btn-add { background: #2563eb; color: #fff; border: none; padding: 7px 11px; border-radius: 6px; font-weight: bold; font-size: 0.78rem; }
    .player-box { width: 100%; background: #000; height: 210px; position: relative; }
    .video-js { width: 100% !important; height: 100% !important; }
    .status-bar { background: #162032; padding: 7px 10px; font-size: 0.78rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; gap: 6px; }
    .now-text { font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
    .mini-btn { background: #0284c7; color: #fff; border: none; padding: 4px 7px; border-radius: 4px; font-size: 0.7rem; font-weight: bold; white-space: nowrap; }
    .qual-btn { background: #0d9488; }
    .live-tag { background: #dc2626; color: #fff; font-size: 0.65rem; font-weight: bold; padding: 3px 6px; border-radius: 4px; }
    .controls { padding: 10px 12px; background: #0f172a; border-bottom: 1px solid #334155; display: flex; flex-direction: column; gap: 8px; }
    .top-filters { display: flex; gap: 8px; }
    .region-select { padding: 8px; border-radius: 6px; border: 1px solid #38bdf8; background: #1e293b; color: #fff; font-size: 0.82rem; font-weight: bold; flex: 1; }
    .search-input { flex: 1; padding: 8px 10px; border-radius: 6px; border: 1px solid #334155; background: #1e293b; color: #fff; font-size: 0.85rem; }
    .categories { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
    .categories::-webkit-scrollbar { display: none; }
    .cat-chip { background: #1e293b; color: #94a3b8; border: 1px solid #334155; padding: 6px 12px; border-radius: 16px; font-size: 0.76rem; font-weight: bold; white-space: nowrap; flex-shrink: 0; }
    .cat-chip.active { background: #2563eb; color: #fff; border-color: #2563eb; }
    .channel-list { flex: 1; overflow-y: auto; padding: 10px 12px 60px 12px; display: flex; flex-direction: column; gap: 8px; }
    .channel-item { display: flex; align-items: center; gap: 12px; background: #1e293b; padding: 10px 12px; border-radius: 8px; border: 1px solid transparent; }
    .channel-item.active { background: #334155; border-color: #38bdf8; }
    .channel-icon { width: 42px; height: 42px; border-radius: 8px; background: #0f172a; color: #38bdf8; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 0.85rem; flex-shrink: 0; overflow: hidden; }
    .channel-icon img { width: 100%; height: 100%; object-fit: contain; }
    .channel-info { flex: 1; overflow: hidden; }
    .channel-name { font-weight: bold; font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .channel-group { font-size: 0.75rem; color: #38bdf8; margin-top: 2px; }
    .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 99; }
    .modal-box { background: #1e293b; border: 1px solid #334155; border-radius: 10px; width: 100%; max-width: 380px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    .modal-box input, .modal-box textarea { width: 100%; padding: 9px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 0.85rem; }
    .modal-btns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 6px; }
  </style>
</head>
<body>
  <header>
    <div class="logo">TV <span>StreamBox Mundial</span></div>
    <button class="btn-add" onclick="openModal()">+ M3U / M3U8</button>
  </header>
  <div class="player-box">
    <video-js id="my-video" class="video-js vjs-default-skin vjs-big-play-centered" controls preload="auto" playsinline></video-js>
  </div>
  <div class="status-bar">
    <span id="nowTitle" class="now-text">Cargando canales...</span>
    <button id="qualBtn" class="mini-btn qual-btn" onclick="cycleQuality()">Calidad: Auto</button>
    <button id="audioBtn" class="mini-btn" style="display:none;" onclick="switchAudio()">Audio: ES</button>
    <span id="liveTag" class="live-tag" style="display:none;">EN VIVO</span>
  </div>
  <div class="controls">
    <div class="top-filters">
      <select id="regionSelect" class="region-select" onchange="loadRegion(this.value)">
        <option value="spa">Latinoamerica y Español</option>
        <option value="bo">Bolivia (Nacional)</option>
        <option value="south_america">Sudamerica (Todo)</option>
        <option value="north_america">Norteamerica (Todo)</option>
        <option value="europe">Europa (Todo)</option>
        <option value="asia">Asia (Todo)</option>
        <option value="africa">Africa (Todo)</option>
        <option value="oceania">Oceania (Todo)</option>
        <option value="world">Todo el Mundo</option>
      </select>
      <input type="text" id="searchBox" class="search-input" placeholder="Buscar canal..." oninput="renderList()">
    </div>
    <div class="categories" id="catBar"></div>
  </div>
  <div class="channel-list" id="listContainer"></div>
  <div id="modal" class="modal-bg">
    <div class="modal-box">
      <h3 style="font-size:1rem;">Agregar Canal o Lista Propia</h3>
      <p style="font-size:0.75rem; color:#38bdf8;">1. Enlace directo .m3u8:</p>
      <input type="text" id="inName" placeholder="Nombre del canal">
      <input type="url" id="inUrl" placeholder="Enlace .m3u8">
      <p style="font-size:0.75rem; color:#38bdf8; margin-top:4px;">2. Lista M3U (URL o texto):</p>
      <input type="url" id="inM3uUrl" placeholder="Enlace de lista .m3u">
      <textarea id="inM3uText" rows="3" placeholder="O pega aqui el texto #EXTM3U"></textarea>
      <div id="errMsg" style="font-size:0.75rem; color:#f87171;"></div>
      <div class="modal-btns">
        <button style="background:#334155; color:#fff; border:none; padding:8px 12px; border-radius:6px;" onclick="closeModal()">Cerrar</button>
        <button class="btn-add" onclick="saveData()">Guardar</button>
      </div>
    </div>
  </div>
  <script>
    var proto = "https:" + "//";
    var baseIptv = proto + "iptv-org.github.io/iptv/";
    var regionUrls = {
      spa: baseIptv + "languages/spa.m3u",
      bo: baseIptv + "countries/bo.m3u",
      south_america: baseIptv + "regions/amer.m3u",
      north_america: baseIptv + "regions/nam.m3u",
      europe: baseIptv + "regions/eur.m3u",
      asia: baseIptv + "regions/asia.m3u",
      africa: baseIptv + "regions/afr.m3u",
      oceania: baseIptv + "regions/oce.m3u",
      world: baseIptv + "index.m3u"
    };

    var catDict = {
      "News": "Noticias", "Sports": "Deportes", "Movies": "Peliculas y Series",
      "Series": "Series", "Documentary": "Documentales", "Music": "Musica",
      "Kids": "Infantil", "Entertainment": "Entretenimiento", "Culture": "Cultura",
      "Education": "Educacion", "Religious": "Religioso", "General": "General",
      "Undefined": "Variedades", "Comedy": "Comedia", "Family": "Familia",
      "Lifestyle": "Estilo de Vida", "Travel": "Viajes", "Science": "Ciencia"
    };

    var fallbackList = [
      { name: "DW Español En Vivo", group: "Noticias", logo: "", url: proto + "dwamdstream104.akamaized.net/hls/live/2015530/dwstream104/index.m3u8" },
      { name: "Red Bull TV En Vivo", group: "Deportes", logo: "", url: proto + "rbmn-live.akamaized.net/hls/live/590964/BoRB-AT/master.m3u8" },
      { name: "Mux Test Stream (HD)", group: "General", logo: "", url: proto + "test-streams.mux.dev/x36xhzz/x36xhzz.m3u8" }
    ];

    var channels = [];
    var activeCat = "Todos";
    var currentUrl = "";
    var vjsPlayer = null;
    var qualLevels = ["Auto", "240p", "360p", "480p", "720p"];
    var qualIdx = 0;

    window.onload = function() {
      if (typeof videojs !== "undefined") {
        vjsPlayer = videojs("my-video", {
          fluid: false,
          html5: { vhs: { overrideNative: true } }
        });
        vjsPlayer.on("loadedmetadata", function() {
          checkAudioTracks();
          applyQualityCap();
        });
        vjsPlayer.on("error", function() {
          document.getElementById("nowTitle").textContent = "Canal caido o bloqueado en tu pais";
        });
      }
      loadRegion("spa");
    };

    function loadRegion(regionKey) {
      var box = document.getElementById("listContainer");
      box.innerHTML = '<p style="text-align:center; color:#38bdf8; margin-top:25px;">Cargando canales...</p>';
      activeCat = "Todos";
      var targetUrl = regionUrls[regionKey] || regionUrls.spa;

      fetch(targetUrl)
        .then(function(r) { return r.text(); })
        .then(function(txt) {
          var parsed = parseM3U(txt);
          channels = parsed.length > 0 ? parsed : fallbackList.slice();
          document.getElementById("nowTitle").textContent = channels.length + " canales disponibles";
          renderCats();
          renderList();
        })
        .catch(function() {
          channels = fallbackList.slice();
          document.getElementById("nowTitle").textContent = "Toca un canal para ver";
          renderCats();
          renderList();
        });
    }

    function renderCats() {
      var cats = ["Todos"];
      for (var i = 0; i < channels.length; i++) {
        var g = channels[i].group || "General";
        if (cats.indexOf(g) === -1) cats.push(g);
      }
      var bar = document.getElementById("catBar");
      bar.innerHTML = "";
      for (var j = 0; j < cats.length; j++) {
        (function(catName) {
          var b = document.createElement("button");
          b.className = "cat-chip" + (catName === activeCat ? " active" : "");
          b.textContent = catName;
          b.onclick = function() { activeCat = catName; renderCats(); renderList(); };
          bar.appendChild(b);
        })(cats[j]);
      }
    }

    function renderList() {
      var q = document.getElementById("searchBox").value.toLowerCase();
      var box = document.getElementById("listContainer");
      box.innerHTML = "";
      var shown = 0;

      for (var i = 0; i < channels.length; i++) {
        var ch = channels[i];
        if ((activeCat !== "Todos" && (ch.group || "General") !== activeCat) || ch.name.toLowerCase().indexOf(q) === -1) continue;
        shown++;
        if (shown > 300) break;

        (function(item) {
          var row = document.createElement("div");
          row.className = "channel-item" + (item.url === currentUrl ? " active" : "");
          row.onclick = function() { playStream(item); };

          var icon = document.createElement("div");
          icon.className = "channel-icon";
          var initials = item.name.substring(0, 2).toUpperCase();
          if (item.logo) {
            icon.innerHTML = '<img src="' + item.logo + '" onerror="this.style.display=\'none\'; this.parentElement.textContent=\'' + initials + '\'">';
          } else {
            icon.textContent = initials;
          }

          var info = document.createElement("div");
          info.className = "channel-info";
          info.innerHTML = '<div class="channel-name">' + item.name + '</div><div class="channel-group">' + (item.group || "General") + '</div>';

          row.appendChild(icon);
          row.appendChild(info);
          box.appendChild(row);
        })(ch);
      }

      if (shown === 0) {
        box.innerHTML = '<p style="text-align:center; color:#94a3b8; margin-top:20px;">No hay canales en esta categoria.</p>';
      }
    }
    function playStream(ch) {
      currentUrl = ch.url;
      document.getElementById("nowTitle").textContent = ch.name;
      document.getElementById("liveTag").style.display = "inline-block";
      document.getElementById("audioBtn").style.display = "none";
      renderList();

      if (vjsPlayer) {
        vjsPlayer.src({ src: ch.url, type: "application/x-mpegURL" });
        vjsPlayer.play();
      }
    }

    function cycleQuality() {
      qualIdx = (qualIdx + 1) % qualLevels.length;
      var label = qualLevels[qualIdx];
      document.getElementById("qualBtn").textContent = "Calidad: " + label;
      applyQualityCap();
    }

    function applyQualityCap() {
      if (!vjsPlayer || !vjsPlayer.qualityLevels) return;
      var qList = vjsPlayer.qualityLevels();
      var target = qualLevels[qualIdx];
      var maxH = target === "Auto" ? 9999 : parseInt(target, 10);

      for (var i = 0; i < qList.length; i++) {
        qList[i].enabled = (qList[i].height <= maxH);
      }
      if (qList.length > 0 && target !== "Auto") {
        var anyEnabled = false;
        for (var j = 0; j < qList.length; j++) { if (qList[j].enabled) anyEnabled = true; }
        if (!anyEnabled) qList[0].enabled = true;
      }
    }

    function checkAudioTracks() {
      if (!vjsPlayer) return;
      var tracks = vjsPlayer.audioTracks();
      var btn = document.getElementById("audioBtn");
      if (tracks && tracks.length > 1) {
        btn.style.display = "inline-block";
        for (var i = 0; i < tracks.length; i++) {
          var lang = (tracks[i].language || tracks[i].label || "").toLowerCase();
          if (lang.indexOf("es") !== -1 || lang.indexOf("spa") !== -1) {
            tracks[i].enabled = true;
            btn.textContent = "Audio: ES";
            return;
          }
        }
        btn.textContent = "Audio (" + tracks.length + ")";
      } else {
        btn.style.display = "none";
      }
    }

    function switchAudio() {
      if (!vjsPlayer) return;
      var tracks = vjsPlayer.audioTracks();
      if (!tracks || tracks.length < 2) return;
      var activeIdx = 0;
      for (var i = 0; i < tracks.length; i++) {
        if (tracks[i].enabled) { activeIdx = i; break; }
      }
      var nextIdx = (activeIdx + 1) % tracks.length;
      for (var j = 0; j < tracks.length; j++) {
        tracks[j].enabled = (j === nextIdx);
      }
      var label = tracks[nextIdx].language || tracks[nextIdx].label || ("Pista " + (nextIdx + 1));
      document.getElementById("audioBtn").textContent = "Audio: " + label.toUpperCase();
    }

    function openModal() {
      document.getElementById("errMsg").textContent = "";
      document.getElementById("inName").value = "";
      document.getElementById("inUrl").value = "";
      document.getElementById("inM3uUrl").value = "";
      document.getElementById("inM3uText").value = "";
      document.getElementById("modal").style.display = "flex";
    }

    function closeModal() { document.getElementById("modal").style.display = "none"; }

    function saveData() {
      var name = document.getElementById("inName").value.trim();
      var url = document.getElementById("inUrl").value.trim();
      var m3uUrl = document.getElementById("inM3uUrl").value.trim();
      var m3uText = document.getElementById("inM3uText").value.trim();
      var err = document.getElementById("errMsg");

      if (url) {
        var newCh = { name: name || "Canal En Vivo", group: "Mis Enlaces", logo: "", url: url };
        channels.unshift(newCh);
        activeCat = "Todos"; renderCats(); renderList();
        playStream(newCh);
        closeModal();
        return;
      }
      if (m3uText) {
        var p = parseM3U(m3uText);
        if (p.length > 0) { channels = p; activeCat = "Todos"; renderCats(); renderList(); closeModal(); }
        else { err.textContent = "Lista invalida."; }
        return;
      }
      if (m3uUrl) {
        err.textContent = "Descargando lista...";
        fetch(m3uUrl).then(function(r) { return r.text(); }).then(function(txt) {
          var p = parseM3U(txt);
          if (p.length > 0) { channels = p; activeCat = "Todos"; renderCats(); renderList(); closeModal(); }
          else { err.textContent = "No se encontraron canales."; }
        }).catch(function() { err.textContent = "Error al descargar. Pega el texto M3U abajo."; });
        return;
      }
      err.textContent = "Ingresa un enlace .m3u8 o una lista M3U.";
    }

    function parseM3U(txt) {
      var lines = txt.split(/\r?\n/);
      var list = [];
      var cur = null;
      for (var i = 0; i < lines.length; i++) {
        var l = lines[i].trim();
        if (l.indexOf("#EXTINF:") === 0) {
          var title = l.split(",").pop().trim() || "Canal";
          var grpMatch = l.match(/group-title="([^"]*)"/i);
          var logoMatch = l.match(/tvg-logo="([^"]*)"/i);
          var rawGrp = grpMatch && grpMatch[1] ? grpMatch[1].split(";")[0].trim() : "General";
          var cleanGrp = catDict[rawGrp] || rawGrp;
          cur = {
            name: title,
            group: cleanGrp,
            logo: logoMatch && logoMatch[1] ? logoMatch[1] : "",
            url: ""
          };
        } else if (l && l.indexOf("#") !== 0 && cur) {
          if (l.indexOf("http") === 0) {
            cur.url = l;
            list.push(cur);
          }
          cur = null;
        }
      }
      return list;
    }
  </script>
</body>
</html>
